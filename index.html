<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PadeLive</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1556C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PadeLive">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#DFE5EE}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;position:relative}
#app>div{height:100%}
button,input{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
*{-webkit-text-size-adjust:100%}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="--bg:{{t.bg}};--sf:{{t.sf}};--tx:{{t.tx}};--mu:{{t.mu}};--bd:{{t.bd}};--pr:{{t.pr}};--prs:{{t.prs}};--onpr:{{t.onpr}};--ok:{{t.ok}};--oks:{{t.oks}};--wn:{{t.wn}};--wns:{{t.wns}};--er:{{t.er}};width:100%;height:100%;min-height:100%;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,sans-serif;display:flex;flex-direction:column">

<!-- ============ CONNEXION ============ -->
<sc-if value="{{s.login}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">
  <div style="position:relative;height:252px;flex:none;background:var(--pr);border-radius:0 0 16px 16px;overflow:hidden">
    <svg aria-hidden="true" width="100%" height="252" viewBox="0 0 390 252" preserveAspectRatio="xMidYMid slice" style="position:absolute;left:0;top:0">
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2">
        <rect x="62" y="24" width="266" height="170" rx="2"></rect>
        <path d="M195 24V194" stroke-opacity="0.5" stroke-width="3"></path>
        <path d="M101 24V194M289 24V194M101 109H289"></path>
      </g>
      <circle cx="262" cy="62" r="11" fill="#D6EB3B"></circle>
      <path d="M254 55c5 4 5 12 0 16M270 55c-5 4-5 12 0 16" fill="none" stroke="#0E1A2B" stroke-opacity="0.35" stroke-width="1.5"></path>
    </svg>
    <button aria-label="Changer de thème" onClick="{{toggleTheme}}" style="position:absolute;right:12px;top:12px;width:44px;height:44px;border:0;border-radius:10px;background:rgba(255,255,255,0.18);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <sc-if value="{{s.isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      <sc-if value="{{s.isDark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
    </button>
    <div style="position:absolute;left:24px;bottom:20px;right:24px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:50px;font-weight:700;line-height:1;color:#FFFFFF;letter-spacing:0.5px">Pade<span style="color:#D6EB3B">Live</span></div>
      <div style="margin-top:6px;font-size:14px;font-weight:600;color:#FFFFFF;opacity:0.92">Le suivi de tournoi de padel, en direct.</div>
    </div>
  </div>
  <div style="padding:24px 24px 28px;display:flex;flex-direction:column;gap:14px">
    <div>
      <h1 style="margin:0;font-size:22px;font-weight:800">Connexion arbitre</h1>
      <p style="margin:6px 0 0;font-size:14px;color:var(--mu);line-height:1.4">Gère ton tournoi et publie les scores en direct.</p>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">Email
      <input type="email" value="{{email}}" onInput="{{onEmail}}" style="height:48px;box-sizing:border-box;border:1.5px solid var(--bd);border-radius:10px;padding:0 14px;font-size:15px;background:var(--sf);color:var(--tx)">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">Mot de passe
      <input type="password" value="{{pw}}" onInput="{{onPw}}" style="height:48px;box-sizing:border-box;border:1.5px solid var(--bd);border-radius:10px;padding:0 14px;font-size:15px;background:var(--sf);color:var(--tx)">
    </label>
    <button onClick="{{soon}}" style="align-self:flex-end;min-height:36px;padding:0;border:0;background:none;color:var(--pr);font-size:13.5px;font-weight:700;cursor:pointer">Mot de passe oublié ?</button>
    <button onClick="{{doLogin}}" style="height:50px;border:0;border-radius:10px;background:var(--pr);color:var(--onpr);font-size:16px;font-weight:800;cursor:pointer">Se connecter</button>
    <div style="display:flex;align-items:center;gap:12px;color:var(--mu);font-size:13px"><div style="flex:1;height:1px;background:var(--bd)"></div>ou<div style="flex:1;height:1px;background:var(--bd)"></div></div>
    <button onClick="{{goCode}}" style="height:50px;border:1.5px solid var(--pr);border-radius:10px;background:transparent;color:var(--pr);font-size:16px;font-weight:800;cursor:pointer">Je suis joueur</button>
    <div style="text-align:center;font-size:13px;color:var(--mu)">Pas besoin de compte : un QR code suffit.</div>
    <div style="text-align:center;font-size:14px;color:var(--mu)">Pas encore de compte ?
      <button onClick="{{soon}}" style="min-height:36px;padding:0 4px;border:0;background:none;color:var(--pr);font-size:14px;font-weight:700;cursor:pointer">Créer un compte arbitre</button>
    </div>
  </div>
</div>
</sc-if>

<!-- ============ EN-TETE COMMUN ============ -->
<sc-if value="{{s.hasHeader}}" hint-placeholder-val="{{ false }}">
<div style="flex:none;display:flex;align-items:center;gap:6px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--bd);background:var(--sf)">
  <sc-if value="{{hdr.back}}" hint-placeholder-val="{{ false }}">
    <button aria-label="Retour" onClick="{{hdr.onBack}}" style="width:44px;height:44px;margin-left:-12px;border:0;background:none;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
  </sc-if>
  <div style="flex:1;min-width:0">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1.1">{{hdr.title}}</div>
    <div style="font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{hdr.sub}}</div>
  </div>
  <sc-if value="{{hdr.hasAction}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{hdr.onAction}}" style="min-height:44px;padding:0 8px;border:0;background:none;color:var(--pr);font-size:13px;font-weight:800;cursor:pointer">{{hdr.action}}</button>
  </sc-if>
  <button aria-label="Changer de thème" onClick="{{toggleTheme}}" style="width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer">
    <sc-if value="{{s.isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
    <sc-if value="{{s.isDark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
  </button>
</div>
</sc-if>

<!-- ============ ARBITRE : MES TOURNOIS ============ -->
<sc-if value="{{s.tournois}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">
  <button onClick="{{openTournoi}}" style="text-align:left;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;font-family:inherit">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--wns);color:var(--wn)">En cours</span>
      <span style="font-size:12.5px;color:var(--mu)">Sam. 17 oct.</span>
    </div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1">P50 du samedi</div>
    <div style="font-size:13.5px;color:var(--mu)">12 paires · 4 terrains · sets de 6 jeux</div>
    <div style="height:8px;border-radius:4px;background:var(--bd);overflow:hidden"><div style="height:8px;background:var(--pr);width:{{prog.pct}}"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>{{prog.txt}}</span><span style="color:var(--pr)">Ouvrir le tableau</span></div>
  </button>
  <div style="font-size:12.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:0.6px;margin-top:6px">Tournois précédents</div>
  <div style="border:1.5px solid var(--bd);background:var(--sf);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-weight:800;font-size:15px">P25 du 3 octobre</div><div style="font-size:13px;color:var(--mu)">8 paires · 12 matchs</div></div>
    <span style="font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--oks);color:var(--ok)">Terminé</span>
  </div>
  <div style="border:1.5px solid var(--bd);background:var(--sf);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-weight:800;font-size:15px">P100 du 26 septembre</div><div style="font-size:13px;color:var(--mu)">16 paires · 32 matchs</div></div>
    <span style="font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--oks);color:var(--ok)">Terminé</span>
  </div>
  <button onClick="{{goCreer}}" style="height:52px;margin-top:6px;border:0;border-radius:10px;background:var(--pr);color:var(--onpr);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nouveau tournoi</button>
</div>
</sc-if>

<!-- ============ ARBITRE : NOUVEAU TOURNOI ============ -->
<sc-if value="{{s.creer}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px">
  <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">Nom du tournoi
    <input type="text" value="{{form.nom}}" onInput="{{onNom}}" style="height:48px;box-sizing:border-box;border:1.5px solid var(--bd);border-radius:10px;padding:0 14px;font-size:15px;background:var(--sf);color:var(--tx)">
  </label>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700">Catégorie</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{form.cats}}" as="c" hint-placeholder-count="3"><button onClick="{{c.press}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:14px;font-weight:800;cursor:pointer">{{c.label}}</button></sc-for></div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700">Nombre de paires</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{form.paires}}" as="c" hint-placeholder-count="3"><button onClick="{{c.press}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:14px;font-weight:800;cursor:pointer">{{c.label}}</button></sc-for></div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700">Terrains disponibles</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{form.terrains}}" as="c" hint-placeholder-count="4"><button onClick="{{c.press}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:14px;font-weight:800;cursor:pointer">{{c.label}}</button></sc-for></div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700">Avantage</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{form.avantages}}" as="c" hint-placeholder-count="2"><button onClick="{{c.press}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:14px;font-weight:800;cursor:pointer">{{c.label}}</button></sc-for></div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700">Format du match (1 set)</div>
    <div style="display:flex;flex-direction:column;gap:8px"><sc-for list="{{form.formats}}" as="c" hint-placeholder-count="2"><button onClick="{{c.press}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 14px;text-align:left;border-radius:10px;border:1.5px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:14px;font-weight:800;cursor:pointer">{{c.label}}</button></sc-for></div></div>
  <div style="border:1.5px solid var(--bd);background:var(--sf);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px">
    <div style="font-size:12.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:0.6px">Durée estimée</div>
    <div style="display:flex;gap:24px;align-items:flex-end">
      <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;line-height:1">{{est.matches}}</div><div style="font-size:13px;color:var(--mu)">matchs</div></div>
      <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;line-height:1;color:var(--pr)">{{est.range}}</div><div style="font-size:13px;color:var(--mu)">avec {{est.courts}} terrains, 30 min par match</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <sc-for list="{{est.row}}" as="r" hint-placeholder-count="4"><div style="border:1.5px solid {{r.bd}};background:{{r.bg}};border-radius:10px;padding:8px 2px;text-align:center"><div style="font-size:11.5px;color:var(--mu);font-weight:700">{{r.t}} terrains</div><div style="font-size:13px;font-weight:800">{{r.txt}}</div></div></sc-for>
    </div>
  </div>
  <button onClick="{{generate}}" style="height:52px;border:0;border-radius:10px;background:var(--pr);color:var(--onpr);font-size:16px;font-weight:800;cursor:pointer">Générer le tableau</button>
  <button onClick="{{soon}}" style="min-height:44px;border:0;background:none;color:var(--pr);font-size:14px;font-weight:700;cursor:pointer">Saisir le premier tour à la main</button>
  <div style="font-size:12.5px;color:var(--mu);line-height:1.4">Maquette : le tableau affiché ensuite est celui d'un P50 à 12 paires, déjà en cours.</div>
</div>
</sc-if>

<!-- ============ TABLEAU (arbitre et joueur) ============ -->
<sc-if value="{{s.segment}}" hint-placeholder-val="{{ false }}">
<div style="flex:none;padding:12px 16px 4px;background:var(--bg)">
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf)">
    <button onClick="{{seg.toPrincipal}}" aria-pressed="{{seg.isP}}" style="min-height:44px;border:0;border-radius:9px;background:{{seg.pBg}};color:{{seg.pFg}};font-size:13px;font-weight:800;cursor:pointer;padding:0 2px">Principal</button>
    <button onClick="{{seg.toClassement}}" aria-pressed="{{seg.isC}}" style="min-height:44px;border:0;border-radius:9px;background:{{seg.cBg}};color:{{seg.cFg}};font-size:13px;font-weight:800;cursor:pointer;padding:0 2px">Classement</button>
    <button onClick="{{seg.toSeeds}}" aria-pressed="{{seg.isS}}" style="min-height:44px;border:0;border-radius:9px;background:{{seg.sBg}};color:{{seg.sFg}};font-size:13px;font-weight:800;cursor:pointer;padding:0 2px">Têtes de série</button>
  </div>
  <div style="margin:8px 0 2px;font-size:12.5px;color:var(--mu)">{{seg.hint}}</div>
</div>
</sc-if>

<sc-if value="{{s.showTree}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;overflow:auto;padding:8px 16px 16px">
  <div style="display:flex;width:max-content">
    <sc-for list="{{tree.cols}}" as="col" hint-placeholder-count="4">
      <div style="display:flex">
        <div style="display:flex;flex-direction:column">
          <div style="height:28px;font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:0.6px">{{col.title}}</div>
          <div style="height:640px;display:flex;flex-direction:column;justify-content:space-around">
            <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="4">
              <button onClick="{{c.tap}}" style="width:172px;height:76px;box-sizing:border-box;border:1.5px solid {{c.bd}};background:var(--sf);color:var(--tx);border-radius:10px;padding:6px 10px;text-align:left;font-family:inherit;display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
                  <span style="min-width:0;font-size:12.5px;font-weight:{{c.aW}};color:{{c.aC}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.aSeed}} {{c.aName}}</span>
                  <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:{{c.aC}}">{{c.aScore}}</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
                  <span style="min-width:0;font-size:12.5px;font-weight:{{c.bW}};color:{{c.bC}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.bSeed}} {{c.bName}}</span>
                  <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:{{c.bC}}">{{c.bScore}}</span>
                </div>
                <div style="font-size:11.5px;font-weight:700;color:{{c.shortC}}">{{c.short}}</div>
              </button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{col.c1}}" hint-placeholder-val="{{ false }}"><div style="padding-top:28px"><svg aria-hidden="true" width="28" height="640" viewBox="0 0 28 640" fill="none" style="stroke:var(--mu);stroke-opacity:0.55;stroke-width:1.5"><path d="M0 80H28M0 240H28M0 400H28M0 560H28"></path></svg></div></sc-if>
        <sc-if value="{{col.c2}}" hint-placeholder-val="{{ false }}"><div style="padding-top:28px"><svg aria-hidden="true" width="28" height="640" viewBox="0 0 28 640" fill="none" style="stroke:var(--mu);stroke-opacity:0.55;stroke-width:1.5"><path d="M0 80H14V160M0 240H14V160M14 160H28M0 400H14V480M0 560H14V480M14 480H28"></path></svg></div></sc-if>
        <sc-if value="{{col.c3}}" hint-placeholder-val="{{ false }}"><div style="padding-top:28px"><svg aria-hidden="true" width="28" height="640" viewBox="0 0 28 640" fill="none" style="stroke:var(--mu);stroke-opacity:0.55;stroke-width:1.5"><path d="M0 160H14V320M0 480H14V320M14 320H28"></path></svg></div></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>

<!-- ============ LISTES : classement / scores ============ -->
<sc-if value="{{s.showList}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:16px">
  <sc-if value="{{list.empty}}" hint-placeholder-val="{{ false }}"><div style="padding:24px 0;text-align:center;color:var(--mu);font-size:14px">Aucun match pour le moment.</div></sc-if>
  <sc-for list="{{list.groups}}" as="g" hint-placeholder-count="2">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:0.6px">{{g.title}}</div>

/* ---- Mini moteur : transforme le gabarit (sc-if / sc-for / {{ }}) en vraie page ---- */
const RE = /\{\{\s*([\w.$]+)\s*\}\}/g;
const get = (scope, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), scope);
const interp = (str, scope) => str.replace(RE, (_, p) => { const v = get(scope, p); return v == null ? '' : String(v); });
const single = (str, scope) => { const m = str.match(/^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/); return m ? get(scope, m[1]) : undefined; };
function kids(node, scope, parent) { node.childNodes.forEach((c) => build(c, scope, parent)); }
function build(node, scope, parent) {
  if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.localName;
  if (tag === 'sc-if') { if (single(node.getAttribute('value'), scope)) kids(node, scope, parent); return; }
  if (tag === 'sc-for') {
    const list = single(node.getAttribute('list'), scope) || [];
    const as = node.getAttribute('as');
    list.forEach((item) => { const s = Object.create(scope); s[as] = item; kids(node, s, parent); });
    return;
  }
  const el = document.createElementNS(node.namespaceURI, tag);
  for (const a of node.attributes) {
    const n = a.name;
    if (n.startsWith('hint-')) continue;
    if (n === 'onclick' || n === 'oninput') { const f = single(a.value, scope); if (typeof f === 'function') el.addEventListener(n.slice(2), f); continue; }
    el.setAttribute(n, interp(a.value, scope));
  }
  kids(node, scope, el);
  parent.appendChild(el);
}

/* ---- Base des composants ---- */
class DCLogic {
  constructor(props) { this.props = props || {}; }
  setState(p) {
    Object.assign(this.state, p);
    if (p && p.toast) { clearTimeout(this._tt); this._tt = setTimeout(() => { this.state.toast = ''; paint(); }, 3000); }
    paint();
  }
}

      M('r1c', 'Tour 1', 7, 10, 'T3', '10:00', { sa: 6, sb: 3, done: true, winTo: ['q4', 'b'] }),
      M('r1d', 'Tour 1', 8, 9, 'T4', '10:00', { sa: 6, sb: 7, done: true, winTo: ['q1', 'b'] }),

  validScore(a, b) {
    if (a === '' || b === '') return false;
    const x = Number(a), y = Number(b);
    const hi = Math.max(x, y), lo = Math.min(x, y);
    return (hi === 6 && lo <= 4) || (hi === 7 && (lo === 5 || lo === 6));
  }

  fmtMin(waves) {
    const m = waves * 30, h = Math.floor(m / 60), r = m % 60;
    return r ? (h + ' h ' + r) : (h + ' h');
  }

  est(paires, terrains) {
    const total = { 8: 12, 12: 20, 16: 32 }[paires];
    const layers = { 8: [4, 4, 4], 12: [4, 6, 6, 4], 16: [8, 8, 8, 8] }[paires];
    const lower = Math.max(Math.ceil(total / terrains), layers.length);
    const upper = layers.reduce((s, n) => s + Math.ceil(n / terrains), 0);
    const txt = lower === upper ? this.fmtMin(lower) : (this.fmtMin(lower) + ' à ' + this.fmtMin(upper));
    return { total: total, txt: txt };
  }

  qrCells() {
    const n = 25, cells = [];
    let seed = 7;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const finder = (i, j) => (i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4));
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let on;
        if (r < 7 && c < 7) on = finder(r, c);
        else if (r < 7 && c >= n - 7) on = finder(r, c - (n - 7));
        else if (r >= n - 7 && c < 7) on = finder(r - (n - 7), c);
        else if ((r === 7 && (c < 8 || c >= n - 8)) || (c === 7 && (r < 8 || r >= n - 8)) || (r === n - 8 && c < 8) || (c === n - 8 && r < 8)) on = false;
        else on = rnd() > 0.5;
        cells.push({ bg: on ? '#0E1A2B' : '#FFFFFF' });
      }
    }
    return cells;
  }

    // ----- cartes de match -----

      const canEdit = isArb && both;
      const short = kind === 'done' ? 'Terminé' : (kind === 'live' ? ('En cours · ' + m.court) : (kind === 'ready' ? (m.court + ' · ' + m.time) : 'En attente'));
      return {
        id: id, label: m.label,
        aSeed: m.a ? String(m.a) : '', aName: m.a ? names[m.a] : 'En attente', aScore: m.done ? String(m.sa) : '',

        bSeed: m.b ? String(m.b) : '', bName: m.b ? names[m.b] : 'En attente', bScore: m.done ? String(m.sb) : '',
        bW: bWin ? '800' : '600', bC: m.b ? ((m.done && !bWin) ? 'var(--mu)' : 'var(--tx)') : 'var(--mu)',
        short: short, shortC: kind === 'live' ? 'var(--wn)' : (kind === 'done' ? 'var(--ok)' : 'var(--mu)'),

        hint: canEdit ? (m.done ? 'Corriger' : 'Saisir le score') : '',

    // ----- arbre -----
    const col = (title, ids, c1, c2, c3) => ({ title: title, cards: ids.map(cardOf), c1: c1, c2: c2, c3: c3 });
    const tree = { cols: [
      col('Tour 1', ['r1d', 'r1b', 'r1a', 'r1c'], true, false, false),
      col('Quarts', ['q1', 'q2', 'q3', 'q4'], false, true, false),
      col('Demies', ['s1', 's2'], false, false, true),
      col('Finale', ['f'], false, false, false)

    // ----- listes -----
    let groups = [];
    if (sc === 'scores') {
      const toDo = ms.filter((m) => !m.done && m.a && m.b).sort((p, q) => p.time.localeCompare(q.time)).map((m) => cardOf(m.id));

      ];
    }
    const list = { groups: groups, empty: groups.length === 0 };

    // ----- saisie d'un score -----
    const e = st.entry;
    let ev = { meta: '', aSeed: '', bSeed: '', aName: '', bName: '', aShow: '–', bShow: '–', aBd: 'var(--bd)', bBd: 'var(--bd)', msg: '', msgC: 'var(--mu)', keys: [], canSubmit: false, cannotSubmit: true, pickA: () => {}, pickB: () => {}, submit: () => {} };

      if (e.error) { msg = e.error; msgC = 'var(--er)'; }
      else if (valid) { const aw = Number(e.a) > Number(e.b); msg = names[aw ? m.a : m.b] + ' gagne ' + Math.max(Number(e.a), Number(e.b)) + '-' + Math.min(Number(e.a), Number(e.b)) + (Math.min(Number(e.a), Number(e.b)) === 6 ? ' (tie-break)' : ''); msgC = 'var(--ok)'; }
      else if (!empty) { msg = 'Score impossible : un set se termine à 6-0 jusqu\'à 6-4, 7-5 ou 7-6.'; msgC = 'var(--er)'; }
      const press = (d) => () => {
        const cur = this.state.entry, f = cur.field;
        const next = Object.assign({}, cur, { error: '' });

        if (f === 'a') next.field = 'b';

      const keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3'].map((d) => ({ label: d, fs: '22px', press: press(d) }));
      keys.push({ label: 'Effacer', fs: '13px', press: () => { const cur = this.state.entry; const next = Object.assign({}, cur, { error: '' }); next[cur.field] = ''; this.setState({ entry: next }); } });

        meta: m.label + ' · ' + m.court + ' · ' + m.time + (m.done ? ' · correction' : ''),

        msg: msg, msgC: msgC, keys: keys, canSubmit: valid, cannotSubmit: !valid,

        submit: () => this.validate()
      };
    }

    // ----- espace joueur -----
    const me = st.myPair;
    const mine = ms.filter((m) => m.a === me || m.b === me);
    const ready = mine.filter((m) => !m.done && m.a && m.b).sort((p, q) => p.time.localeCompare(q.time))[0];
    const pendingM = mine.find((m) => !m.done && !(m.a && m.b));
    const places = [winner(byId('f')), loser(byId('f')), winner(byId('p3')), loser(byId('p3')), winner(byId('p5')), loser(byId('p5')), winner(byId('p7')), loser(byId('p7')), winner(byId('p9')), loser(byId('p9')), winner(byId('p11')), loser(byId('p11'))];

        const c58 = byId('c58a');

    const placeIdx = places.indexOf(me);
    const history = mine.filter((m) => m.done).map((m) => {
      const isA = m.a === me;

    });

    };
    const pairsList = Object.keys(names).map((k) => ({ seed: k, name: names[k], pick: () => go('jmatch', { myPair: Number(k) }) }));
    const placesList = places.map((id, i) => ({ rank: String(i + 1), name: id ? names[id] : 'À déterminer', w: id ? '800' : '600', c: id ? 'var(--tx)' : 'var(--mu)', rc: id ? 'var(--pr)' : 'var(--mu)' }));

    const chip = (key, v, label) => { const on = f[key] === v; return { label: label, on: on, bg: on ? 'var(--pr)' : 'var(--sf)', fg: on ? 'var(--onpr)' : 'var(--tx)', bd: on ? 'var(--pr)' : 'var(--bd)', press: setF(key, v) }; };
    const form = {
      nom: f.nom,
      cats: ['P25', 'P50', 'P100'].map((v) => chip('cat', v, v)),
      paires: [8, 12, 16].map((v) => chip('paires', v, String(v))),
      terrains: [3, 4, 5, 6].map((v) => chip('terrains', v, String(v))),
      avantages: ['Avec', 'Sans'].map((v) => chip('avantage', v, v)),
      formats: [chip('format', 6, '6 jeux · tie-break à 6-6'), chip('format', 9, '9 jeux · tie-break à 8-8')]
    };
    const cur = this.est(f.paires, f.terrains);
    const est = {
      matches: String(cur.total), range: cur.txt, courts: String(f.terrains),
      row: [3, 4, 5, 6].map((c) => ({ t: String(c), txt: this.est(f.paires, c).txt, bg: c === f.terrains ? 'var(--prs)' : 'var(--bg)', bd: c === f.terrains ? 'var(--pr)' : 'var(--bd)' }))
    };

    // ----- en-tete -----
    const H = {
      tournois: { title: 'Mes tournois', sub: 'Espace arbitre', back: false, action: 'Déconnexion', onAction: () => go('login', { role: 'arbitre' }) },

      scores: { title: 'Scores', sub: doneN + ' sur ' + total + ' matchs terminés', back: false },
      score: { title: 'Saisie du score', sub: 'Un set, sans avantage', back: true, onBack: () => go(st.returnTo) },

      jmatch: { title: 'Mon match', sub: 'P50 du samedi · en direct', back: false, action: 'Quitter', onAction: () => go('login', { role: 'arbitre' }) },
      jclass: { title: 'Classement', sub: 'P50 du samedi', back: false, action: 'Quitter', onAction: () => go('login', { role: 'arbitre' }) }
    };
    const h0 = H[sc] || { title: '', sub: '', back: false };
    const hdr = { title: h0.title, sub: h0.sub, back: !!h0.back, onBack: h0.onBack || (() => {}), hasAction: !!h0.action, action: h0.action || '', onAction: h0.onAction || (() => {}) };

    const act = (s2) => (sc === s2 ? 'var(--pr)' : 'var(--mu)');
    const nav = {
      toTournois: () => go('tournois'), toTableau: () => go('tableau'), toScores: () => go('scores'), toPartage: () => go('partage'),
      cTournois: act('tournois'), cTableau: act('tableau'), cScores: act('scores'), cPartage: act('partage'),

    const isP = st.view === 'principal', isC = st.view === 'classement', isS = st.view === 'seeds';

      pBg: isP ? 'var(--pr)' : 'transparent', pFg: isP ? 'var(--onpr)' : 'var(--tx)',
      cBg: isC ? 'var(--pr)' : 'transparent', cFg: isC ? 'var(--onpr)' : 'var(--tx)',
      sBg: isS ? 'var(--pr)' : 'transparent', sFg: isS ? 'var(--onpr)' : 'var(--tx)',
      toPrincipal: () => this.setState({ view: 'principal' }), toClassement: () => this.setState({ view: 'classement' }), toSeeds: () => this.setState({ view: 'seeds' }),
      hint: isS ? 'Poids = classement du joueur 1 + classement du joueur 2. Plus il est petit, meilleure est la tête de série.' : (isArb ? 'Touche un match pour saisir ou corriger son score.' : (isP ? 'Fais défiler vers la droite. Ton match est encadré en bleu.' : 'Les matchs de classement attribuent chaque place.'))
    };
    const RK = { 1: [35495, 40300], 2: [41210, 38950], 3: [44870, 42115], 4: [47320, 45680], 5: [52140, 49905], 6: [58760, 51230], 7: [61450, 57390], 8: [66280, 63015], 9: [72540, 68870], 10: [79105, 74320], 11: [85660, 81245], 12: [93410, 88730] };
    const fmt = (v) => v.toLocaleString('fr-FR');
    const seeds = Object.keys(names).map((k) => {
      const n = Number(k), direct = n <= 4;
      const isMe = !isArb && n === st.myPair;
      const pl = names[k].split(' / '), rk = RK[n];
      return { seed: k, name: names[k], r1Name: pl[0], r1: fmt(rk[0]), r2Name: pl[1], r2: fmt(rk[1]), weight: fmt(rk[0] + rk[1]), entry: direct ? 'Entre directement en quart de finale' : 'Joue le tour 1', chip: direct ? 'Quart' : 'Tour 1', chipBg: direct ? 'var(--prs)' : 'var(--bg)', chipFg: direct ? 'var(--pr)' : 'var(--mu)', bd: isMe ? 'var(--pr)' : 'var(--bd)' };
    });

    const s = {
      login: sc === 'login', code: sc === 'code', choix: sc === 'choix', jmatch: sc === 'jmatch', jclass: sc === 'jclass',
      tournois: sc === 'tournois', creer: sc === 'creer', tableau: sc === 'tableau', scores: sc === 'scores', score: sc === 'score', partage: sc === 'partage',
      hasHeader: sc !== 'login',
      navArb: isArb && (sc === 'tournois' || sc === 'tableau' || sc === 'scores' || sc === 'partage'),
      navJou: !isArb && (sc === 'tableau' || sc === 'jmatch' || sc === 'jclass'),
      segment: sc === 'tableau',
      showTree: sc === 'tableau' && st.view === 'principal',
      showList: sc === 'scores' || (sc === 'tableau' && st.view === 'classement'),
      showSeeds: sc === 'tableau' && st.view === 'seeds',
      isDark: dark, isLight: !dark, hasToast: !!st.toast
    };
    const hasNav = s.navArb || s.navJou;

    return {
      t: t, s: s, hdr: hdr, nav: nav, seg: seg, seeds: seeds, tree: tree, list: list, ev: ev, me: meV, pairsList: pairsList, places: placesList, form: form, est: est,
      email: st.email, pw: st.pw, code: st.code, toast: st.toast, toastBottom: hasNav ? '88px' : '24px',
      prog: { pct: Math.round((doneN / total) * 100) + '%', txt: doneN + ' sur ' + total + ' matchs terminés' },
      qr: this.qrCells(),
      toggleTheme: () => this.setState({ theme: dark ? 'clair' : 'sombre' }),
      onEmail: (x) => this.setState({ email: x.target.value }),
      onPw: (x) => this.setState({ pw: x.target.value }),
      onCode: (x) => this.setState({ code: x.target.value }),
      onNom: (x) => this.setState({ form: Object.assign({}, f, { nom: x.target.value }) }),
      soon: () => this.setState({ toast: 'Écran non inclus dans la maquette.' }),
      doLogin: () => go('tournois', { role: 'arbitre' }),
      goCode: () => go('code', { role: 'joueur' }),
      goChoix: () => go('choix'),
      goCreer: () => go('creer'),
      openTournoi: () => go('tableau', { view: 'principal' }),
      generate: () => go('tableau', { view: 'principal', toast: 'Tableau généré pour ' + f.paires + ' paires (démo : P50 à 12 paires affiché).' }),
      copyLink: () => this.setState({ toast: 'Lien copié.' }),
      viewAsPlayer: () => go('jmatch', { role: 'joueur' })
    };
  }

  openEntry(m) {
    this.setState({ entry: { id: m.id, a: m.done ? String(m.sa) : '', b: m.done ? String(m.sb) : '', field: 'a', error: '' }, returnTo: this.state.screen, screen: 'score', toast: '' });
  }

  validate() {
    const e = this.state.entry;
    const names = this.names();
    const ms = JSON.parse(JSON.stringify(this.state.matches));
    const find = (id) => ms.find((x) => x.id === id);
    const m = find(e.id);
    const sa = Number(e.a), sb = Number(e.b);
    const win = sa > sb ? m.a : m.b, lose = sa > sb ? m.b : m.a;
    if (m.done) {
      const oldWin = m.sa > m.sb ? m.a : m.b;
      if (oldWin !== win) {
        const blocked = [m.winTo, m.loseTo].filter((x) => x).some((x) => find(x[0]).done);
        if (blocked) { this.setState({ entry: Object.assign({}, e, { error: 'Le match suivant est déjà joué : l\'arbitre décide à la main.' }) }); return; }
      }
    }
    m.sa = sa; m.sb = sb; m.done = true; m.live = false;
    if (m.winTo) find(m.winTo[0])[m.winTo[1]] = win;
    if (m.loseTo) find(m.loseTo[0])[m.loseTo[1]] = lose;
    const qf = ['q1', 'q2', 'q3', 'q4'].map(find);
    if (qf.every((q) => q.done)) {
      const ca = find('c58a'), cb = find('c58b');
      if (!ca.done && !cb.done) {
        const L = qf.map((q) => (q.sa > q.sb ? q.b : q.a)).sort((p, q) => p - q);
        ca.a = L[0]; ca.b = L[3]; cb.a = L[1]; cb.b = L[2];
      }
    }
    this.setState({ matches: ms, entry: null, screen: this.state.returnTo, toast: 'Score validé : ' + names[win] + ' gagne ' + Math.max(sa, sb) + '-' + Math.min(sa, sb) + '.' });
  }
}

/* ---- Affichage ---- */
const comp = new Component({});
const tplRoot = document.getElementById('tpl').content.firstElementChild;
const appEl = document.getElementById('app');
let lastSig = '';
function paint() {
  const active = document.activeElement;
  const inputs = Array.from(appEl.querySelectorAll('input'));
  const idx = inputs.indexOf(active);
  const sel = idx >= 0 ? [active.selectionStart, active.selectionEnd] : null;
  const sig = comp.state.screen + '|' + comp.state.view;
  const scrollers = () => Array.from(appEl.querySelectorAll('[style*="overflow"]'));
  const saved = sig === lastSig ? scrollers().map((e) => [e.scrollTop, e.scrollLeft]) : null;
  lastSig = sig;
  const frag = document.createDocumentFragment();
  build(tplRoot, comp.renderVals(), frag);
  appEl.replaceChildren(frag);
  if (saved) scrollers().forEach((e, i) => { if (saved[i]) { e.scrollTop = saved[i][0]; e.scrollLeft = saved[i][1]; } });
  if (idx >= 0) {
    const n = Array.from(appEl.querySelectorAll('input'))[idx];
    if (n) { n.focus(); try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
}
paint();
</script>
